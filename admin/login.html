<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/logo.png">
<title>Login Admin - Aether Store</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body { background:#3b3b3b; color:#fff; font-family:'Poppins',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; margin:0;}
  .login-box { background:#2a2a2a; padding:2.5rem; border-radius:20px; width:100%; max-width:380px; border:1px solid #444; margin:1rem;}
  .login-box h1 { font-family:'Lilita One',sans-serif; text-align:center; color:#3bb2f6; font-size:1.5rem; margin-bottom:1.5rem;}
  .form-control { background:#1f1f1f; color:#fff; border:1px solid #444;}
  .form-control:focus { background:#1f1f1f; color:#fff; border-color:#3bb2f6; box-shadow:none;}
  #errMsg { display:none; }
  .peta { color:#aaa; font-size:14px; text-decoration:none;}
  .peta:hover { color:#3bb2f6; }
</style>
</head>
<body>
  <div class="login-box">
    <h1><i class="bi bi-shield-lock"></i> Login Admin</h1>
    <div class="alert alert-danger py-2" id="errMsg"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" style="border-radius:10px;">Masuk</button>
    </form>
    <div class="text-center mt-3">
      <a href="/" class="peta">&larr; Kembali ke situs</a>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script>
  auth.onAuthStateChanged((user) => {
    if (user) window.location.href = "dashboard.html";
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errBox = document.getElementById("errMsg");
    errBox.style.display = "none";
    try {
      await auth.signInWithEmailAndPassword(email, password);
      window.location.href = "dashboard.html";
    } catch (err) {
      errBox.textContent = "Email atau password salah.";
      errBox.style.display = "block";
    }
  });
</script>
</body>
</html>
